<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Find your exchange path · Abroad Life with Anja</title>
<link rel="icon" href="favicon.ico?v=8" sizes="any">
<link rel="icon" href="favicon.svg?v=8" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF6EF;--teal:#254551;--tealsoft:#55717B;--red:#9E1B1E;--rose:#C98478;--peach:#FFE6D6;--line:rgba(37,69,81,.16);--card:#F5EEE3}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--teal);font-family:'Instrument Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}
[lang-hr]{display:none}
body.hr [lang-hr]{display:inline}
body.hr [lang-en]{display:none}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;max-width:1100px;width:100%;margin:0 auto}
.back{font-size:12px;letter-spacing:2.4px;text-transform:uppercase;text-decoration:none;font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.lang button{background:none;border:0;padding:8px 13px;font:600 11px 'Instrument Sans',sans-serif;letter-spacing:1px;color:var(--teal);cursor:pointer}
.lang button.on{background:var(--teal);color:var(--peach)}
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:10px 22px 70px}
.screen{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{font-size:11.5px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:14px}
h1,h2{font-family:'Gloock',serif;font-weight:400;color:var(--teal);margin:0}
h1{font-size:clamp(36px,6vw,62px);line-height:1.04}
h1 em,h2 em{font-family:'Playfair Display',serif;font-style:italic;color:var(--rose)}
h2{font-size:clamp(26px,4vw,38px);line-height:1.12;margin-bottom:8px}
.lead{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;line-height:1.55;color:var(--tealsoft);max-width:560px}
.intro{text-align:center;padding-top:40px}
.intro .lead{margin:18px auto 26px}
.meta{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--tealsoft);margin-bottom:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--teal);color:var(--peach);border:0;border-radius:2px;padding:17px 32px;font:600 12px 'Instrument Sans',sans-serif;letter-spacing:2.6px;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s}
.btn:hover{background:var(--red)}
.btn.ghost{background:none;color:var(--teal);border:1px solid var(--teal)}
.btn.ghost:hover{background:var(--teal);color:var(--peach)}
.note{font-size:12.5px;color:var(--tealsoft);margin-top:18px}
/* progress */
.prog{margin:4px 0 34px}
.prog-top{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:2.2px;text-transform:uppercase;font-weight:600;margin-bottom:10px}
.prog-top span:last-child{color:var(--tealsoft);letter-spacing:1px}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bar i{height:3px;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i b{position:absolute;inset:0;width:0;background:var(--teal);transition:width .4s ease}
.q-help{font-size:14px;color:var(--tealsoft);margin:0 0 22px}
/* options */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.opt{background:none;border:1px solid var(--line);border-radius:4px;padding:17px 18px;text-align:left;font:500 15.5px 'Instrument Sans',sans-serif;color:var(--teal);cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--teal);background:rgba(37,69,81,.03)}
.opt.sel{border-color:var(--teal);background:var(--teal);color:var(--peach)}
.pics{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.pic{padding:0;overflow:hidden;display:flex;flex-direction:column;background:#fff;border-color:transparent;box-shadow:0 1px 0 var(--line)}
.pic .im{aspect-ratio:4/5;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:44px;transition:transform .5s}
.pic:hover .im{transform:scale(1.03)}
.pic span.t{padding:13px 14px 15px;font-size:14.5px;line-height:1.3}
.pic.sel{background:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.pic.sel span.t{color:var(--peach)}
.navq{display:flex;justify-content:space-between;align-items:center;margin-top:30px}
.prev{background:none;border:0;color:var(--tealsoft);font:500 13px 'Instrument Sans',sans-serif;cursor:pointer;padding:6px 0}
.prev:hover{color:var(--teal)}
.prev[hidden]{visibility:hidden;display:block}
/* section intro */
.sec{text-align:center;padding-top:50px}
.sec .num{font-family:'Gloock',serif;font-size:76px;line-height:1;color:var(--rose);opacity:.55}
.sec .lead{margin:14px auto 30px}
/* result */
.res-head{text-align:center;padding:26px 0 30px}
.stage{display:inline-block;font-size:11.5px;letter-spacing:2.6px;text-transform:uppercase;font-weight:600;background:var(--peach);color:var(--teal);padding:8px 16px;border-radius:30px;margin-bottom:18px}
.res-head .lead{margin:16px auto 0}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.blk{border:1px solid var(--line);border-radius:4px;padding:24px 24px 22px;background:rgba(255,255,255,.5)}
.blk.wide{grid-column:1/-1}
.blk h3{font-size:11px;letter-spacing:2.6px;text-transform:uppercase;font-weight:600;color:var(--red);margin:0 0 12px}
.blk .big{font-family:'Gloock',serif;font-size:24px;line-height:1.2;margin:0 0 10px}
.blk p{margin:0;font-size:15px;line-height:1.6;color:#3d4f56}
.dl{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.dl li{font-family:'Gloock',serif;font-size:20px;line-height:1.25}
.dl b{display:block;font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:12.5px;color:var(--tealsoft);margin-bottom:6px}
@media(max-width:640px){.dl{grid-template-columns:1fr;gap:14px}}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.55}
.steps li:first-child{border-top:0;padding-top:2px}
.steps li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;background:var(--teal);color:var(--peach);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.steps a{font-weight:600}
.cta{text-align:center;margin-top:34px}
.cta .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.small{display:block;margin-top:18px;font-size:13.5px;color:var(--tealsoft)}
.tools{display:flex;gap:22px;justify-content:center;margin-top:30px;font-size:13px}
.tools button{background:none;border:0;color:var(--tealsoft);text-decoration:underline;cursor:pointer;font:inherit}
.priv{text-align:center;font-size:12px;color:var(--tealsoft);margin-top:26px;max-width:520px;margin-left:auto;margin-right:auto;line-height:1.55}
@media(max-width:640px){
.top{padding:16px 18px}
main{padding:4px 16px 60px}
.opts{grid-template-columns:1fr}
.pics{grid-template-columns:1fr 1fr;gap:10px}
.pic .im{aspect-ratio:1/1;font-size:36px}
.pic span.t{font-size:13.5px;padding:10px 11px 12px}
.blocks{grid-template-columns:1fr}
.intro{padding-top:20px}
.btn{padding:16px 24px}
}
@media print{.top,.cta,.tools,.priv{display:none}body{background:#fff}.blk{break-inside:avoid}}
</style>
</head>

<main id="app"></main>

<script>
(function(){
var VIBER='https://invite.viber.com/?g2=AQBtLuMce%2B41sldE47PXmBb3L4xMvrYu1gtPT2LRKj%2F8D4m8upZg9Rt%2F%2Fkg5GCZR';
var KIT='https://anja-health-exchange.kit.com/';
var G={
  starter:{en:'Starter guide for exchange',hr:'Početni vodič za razmjenu',url:KIT+'starterguide'},
  balkan:{en:'Exchange from the Balkans to the USA: a simple guide (in Croatian)',hr:'Razmjena s Balkana u SAD: jednostavan vodič',url:KIT+'balkanusa'},
  hostq:{en:'Host family: questions & conversations that bring you closer',hr:'Host obitelj: pitanja i razgovori koji vas zbliže',url:KIT+'b3a5ab43fe'},
  pack:{en:'The ultimate exchange packing list nobody gives you',hr:'The ultimate exchange packing list nobody gives you',url:KIT+'products/exchange-packing-guide'},
  year:{en:'Your year abroad: a year in an American high school',hr:'Your year abroad: a year in an American high school',url:KIT+'products/your-year-abroad-year-in-an-america'}
};
var FLEX=['ba','rs','me','mk','xk'];

/* each question: id, sec (0..2), type 'pic' or 'txt', q {en,hr}, help, opts [{v,en,hr,img|emo,bg}] */
var Q=[
{id:'country',sec:0,q:{en:'Where are you from?',hr:'Odakle si?'},help:{en:'This tells me which programs are open to you.',hr:'Ovo mi govori koji su ti programi dostupni.'},opts:[
 {v:'hr',en:'Croatia',hr:'Hrvatska'},{v:'ba',en:'Bosnia and Herzegovina',hr:'Bosna i Hercegovina'},{v:'rs',en:'Serbia',hr:'Srbija'},{v:'me',en:'Montenegro',hr:'Crna Gora'},{v:'mk',en:'North Macedonia',hr:'Sjeverna Makedonija'},{v:'xk',en:'Kosovo',hr:'Kosovo'},{v:'si',en:'Slovenia',hr:'Slovenija'},{v:'other',en:'Somewhere else',hr:'Negdje drugdje'}]},
{id:'grade',sec:0,q:{en:'What grade are you in?',hr:'Koji si razred?'},opts:[
 {v:'pri',en:'Last year of primary school',hr:'Zadnji razred osnovne škole'},{v:'hs12',en:'1st or 2nd year of high school',hr:'1. ili 2. razred srednje škole'},{v:'hs34',en:'3rd or 4th year of high school',hr:'3. ili 4. razred srednje škole'},{v:'done',en:'I have finished school',hr:'Završio/la sam školu'}]},
{id:'english',sec:0,q:{en:'How comfortable is your English?',hr:'Koliko ti je ugodno na engleskom?'},opts:[
 {v:'start',en:'I am just starting',hr:'Tek počinjem'},{v:'ok',en:'I get by',hr:'Snađem se'},{v:'good',en:'I feel confident',hr:'Osjećam se sigurno'}]},
{id:'when',sec:0,q:{en:'When would you like to go?',hr:'Kada bi htio/la ići?'},opts:[
 {v:'next',en:'Next school year',hr:'Iduće školske godine'},{v:'two',en:'In about two years',hr:'Za otprilike dvije godine'},{v:'unsure',en:'I am not sure yet',hr:'Još nisam siguran/na'}]},

{id:'place',sec:1,type:'pic',q:{en:'Which USA feels like you?',hr:'Koji SAD je tvoj?'},help:{en:'On most programs you can\'t choose your state, so this is just for your dream.',hr:'Na većini programa ne biraš saveznu državu, pa je ovo samo za tvoj san.'},opts:[
 {v:'town',en:'Small town and open fields',hr:'Mali grad i otvorena polja',img:'img/flag1.jpg'},{v:'city',en:'Big city lights',hr:'Svjetla velikog grada',img:'vid/nyc.jpg'},{v:'cali',en:'Sunny California and the beach',hr:'Sunčana Kalifornija i plaža',img:'vid/palms3.jpg'},{v:'north',en:'The snowy north',hr:'Snježni sjever',emo:'❄️',bg:'linear-gradient(160deg,#DCE6EC,#F4F1EC)'}]},
{id:'excite',sec:1,type:'pic',q:{en:'What are you most excited about?',hr:'Čemu se najviše veseliš?'},opts:[
 {v:'school',en:'School spirit and sports',hr:'Školski duh i sport',img:'img/bg1.jpg'},{v:'family',en:'A host family and new friends',hr:'Host obitelj i novi prijatelji',img:'img/flag3.jpg'},{v:'travel',en:'Travelling around the USA',hr:'Putovanja po SAD-u',img:'img/bg2.jpg'},{v:'future',en:'My English and my future',hr:'Moj engleski i moja budućnost',img:'img/img1.jpg'}]},
{id:'back',sec:1,type:'pic',q:{en:'What do you want to come back with?',hr:'S čim se želiš vratiti kući?'},opts:[
 {v:'conf',en:'More confidence',hr:'Više samopouzdanja',emo:'✨',bg:'#F6E3DA'},{v:'eng',en:'Fluent English',hr:'Tečan engleski',emo:'💬',bg:'#E3ECEC'},{v:'friends',en:'Friends for life',hr:'Prijatelji za cijeli život',emo:'🤍',bg:'#F2E9DD'},{v:'clear',en:'A clear idea of my future',hr:'Jasna slika moje budućnosti',emo:'🧭',bg:'#E8E4EF'}]},

{id:'stage',sec:2,q:{en:'How far are you?',hr:'Dokle si stigao/la?'},opts:[
 {v:'dream',en:'I am just dreaming about it',hr:'Za sada samo sanjam o tome'},{v:'read',en:'I have read about it',hr:'Čitao/la sam o tome'},{v:'agency',en:'I have talked to an agency',hr:'Razgovarao/la sam s agencijom'},{v:'applied',en:'I have already applied',hr:'Već sam se prijavio/la'}]},
{id:'budget',sec:2,q:{en:'What fits your family\'s budget?',hr:'Što odgovara budžetu tvoje obitelji?'},opts:[
 {v:'full',en:'I need a full scholarship',hr:'Treba mi puna stipendija'},{v:'part',en:'We can pay part of it',hr:'Možemo platiti dio'},{v:'paid',en:'A paid program is fine',hr:'Plaćeni program je u redu'}]},
{id:'worry',sec:2,type:'pic',q:{en:'What worries you most?',hr:'Što te najviše brine?'},opts:[
 {v:'money',en:'Money',hr:'Novac',emo:'💸',bg:'#F2E9DD'},{v:'english',en:'My English',hr:'Moj engleski',emo:'🗣️',bg:'#E3ECEC'},{v:'home',en:'Missing home',hr:'Nedostajat će mi dom',emo:'🏡',bg:'#F6E3DA'},{v:'host',en:'My host family',hr:'Moja host obitelj',emo:'👨‍👩‍👧',bg:'#E8E4EF'},{v:'process',en:'The application process',hr:'Proces prijave',emo:'📝',bg:'#EFE7D6'}]},
{id:'parents',sec:2,q:{en:'Do your parents know?',hr:'Znaju li tvoji roditelji?'},opts:[
 {v:'yes',en:'Yes, and they support it',hr:'Da, i podržavaju me'},{v:'unsure',en:'They know, but they are not sure',hr:'Znaju, ali nisu sigurni'},{v:'no',en:'Not yet',hr:'Još ne'}]}
];
var SEC=[
 {en:'About you',hr:'O tebi',lead:{en:'A few quick questions so I know where you are starting from.',hr:'Nekoliko kratkih pitanja da znam odakle krećeš.'}},
 {en:'Your dream year',hr:'Tvoja godina iz snova',lead:{en:'Now the fun part. Imagine your year in the USA.',hr:'A sada ono najljepše. Zamisli svoju godinu u SAD-u.'}},
 {en:'Where you are now',hr:'Gdje si sada',lead:{en:'Last few questions, and then your plan is ready.',hr:'Još par pitanja i tvoj plan je spreman.'}}
];

var L='en',A={},step=-1,app=document.getElementById('app');
try{L=localStorage.getItem('awa-lang')||'en'}catch(e){}
function setLang(l){L=l;document.body.classList.toggle('hr',l==='hr');document.documentElement.lang=l;document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===l)});try{localStorage.setItem('awa-lang',l)}catch(e){}}
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){setLang(b.dataset.l)}});
setLang(L);
function t(o){return '<span lang-en>'+o.en+'</span><span lang-hr>'+o.hr+'</span>'}

/* flow: intro, then for each section: section card, questions */
var FLOW=[];[0,1,2].forEach(function(s){FLOW.push({sec:s});Q.forEach(function(q,i){if(q.sec===s)FLOW.push({q:i})})});

function progress(sec){
  var inSec=Q.filter(function(q){return q.sec===sec}),done=inSec.filter(function(q){return A[q.id]}).length;
  var bars=[0,1,2].map(function(s){var w=s<sec?100:s>sec?0:Math.round(done/inSec.length*100);return '<i><b style="width:'+w+'%"></b></i>'}).join('');
  return '<div class="prog"><div class="prog-top"><span>'+(sec+1)+' / 3 · '+t(SEC[sec])+'</span><span>~2 min</span></div><div class="bar">'+bars+'</div></div>';
}
function render(){
  window.scrollTo(0,0);
  if(step<0){
    app.innerHTML='<div class="screen intro"><div class="kick">'+t({en:'2-minute quiz',hr:'Kviz od 2 minute'})+'</div><h1>'+t({en:'Find your <em>exchange</em> path',hr:'Pronađi svoj put na <em>razmjenu</em>'})+'</h1><p class="lead">'+t({en:'Answer a few short questions and get your own exchange plan: where you are, which route fits you, and what to do next.',hr:'Odgovori na nekoliko kratkih pitanja i dobit ćeš svoj plan za razmjenu: gdje si sada, koji put ti odgovara i što napraviti dalje.'})+'</p><div class="meta"><span>'+t({en:'3 short parts',hr:'3 kratka dijela'})+'</span><span>·</span><span>'+t({en:'11 questions',hr:'11 pitanja'})+'</span><span>·</span><span>'+t({en:'Nothing is saved',hr:'Ništa se ne sprema'})+'</span></div><button class="btn" id="go">'+t({en:'Start the quiz',hr:'Kreni s kvizom'})+' →</button><p class="note">'+t({en:'Your answers stay in your browser and disappear when you close the page.',hr:'Tvoji odgovori ostaju samo u tvom pregledniku i nestaju kad zatvoriš stranicu.'})+'</p></div>';
    document.getElementById('go').onclick=function(){step=0;render()};
    return;
  }
  if(step>=FLOW.length){return result()}
  var f=FLOW[step];
  if(f.sec!==undefined){
    var s=SEC[f.sec];
    app.innerHTML='<div class="screen">'+progress(f.sec)+'<div class="sec"><div class="num">0'+(f.sec+1)+'</div><h2>'+t(s)+'</h2><p class="lead">'+t(s.lead)+'</p><button class="btn" id="go">'+t({en:'Continue',hr:'Nastavi'})+' →</button></div><div class="navq"><button class="prev" id="pv">← '+t({en:'Back',hr:'Natrag'})+'</button><span></span></div></div>';
    document.getElementById('go').onclick=function(){step++;render()};
    document.getElementById('pv').onclick=function(){step--;render()};
    return;
  }
  var q=Q[f.q],pic=q.type==='pic';
  var o=q.opts.map(function(op){
    var sel=A[q.id]===op.v?' sel':'';
    if(pic){var st=op.img?'background-image:url('+op.img+')':'background:'+op.bg;return '<button class="opt pic'+sel+'" data-v="'+op.v+'"><span class="im" style="'+st+'">'+(op.emo||'')+'</span><span class="t">'+t(op)+'</span></button>'}
    return '<button class="opt'+sel+'" data-v="'+op.v+'">'+t(op)+'</button>';
  }).join('');
  app.innerHTML='<div class="screen">'+progress(q.sec)+'<h2>'+t(q.q)+'</h2>'+(q.help?'<p class="q-help">'+t(q.help)+'</p>':'<p class="q-help">&nbsp;</p>')+'<div class="opts'+(pic?' pics':'')+'">'+o+'</div><div class="navq"><button class="prev" id="pv">← '+t({en:'Back',hr:'Natrag'})+'</button><span></span></div></div>';
  app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){A[q.id]=b.dataset.v;app.querySelectorAll('.opt').forEach(function(x){x.classList.toggle('sel',x===b)});setTimeout(function(){step++;render()},260)}});
  document.getElementById('pv').onclick=function(){step--;render()};
}
function lbl(id){var q=Q.filter(function(x){return x.id===id})[0];var o=q.opts.filter(function(x){return x.v===A[id]})[0];return o||{en:'',hr:''}}
function low(o){return {en:o.en.charAt(0).toLowerCase()+o.en.slice(1),hr:o.hr.charAt(0).toLowerCase()+o.hr.slice(1)}}

function result(){
  /* stage */
  var st=A.stage,stage;
  if(st==='agency'||st==='applied')stage='almost';
  else if(st==='read'||(st==='dream'&&A.when==='next'))stage='plan';
  else stage='dream';
  var STAGE={
   dream:{n:{en:'Dreaming',hr:'Sanjaš'},p:{en:'You are at the most exciting part, when it is still a dream. This is the perfect time to learn how everything works, without any pressure.',hr:'Ti si u najljepšoj fazi, kad je sve još san. Ovo je savršeno vrijeme da bez pritiska saznaš kako sve funkcionira.'}},
   plan:{n:{en:'Planning',hr:'Planiraš'},p:{en:'You already know you want this. Now it is about choosing the right program and getting ready one step at a time.',hr:'Već znaš da to želiš. Sada je važno odabrati pravi program i pripremati se korak po korak.'}},
   almost:{n:{en:'Almost there',hr:'Skoro si tamo'},p:{en:'You are closer than you think! Now it is all about the details, so you arrive prepared and make the most of every moment.',hr:'Bliže si nego što misliš! Sada su važni detalji, da stigneš spreman/na i iskoristiš svaki trenutak.'}}
  }[stage];

  /* dream lines */
  var dream='<ul class="dl"><li><b>'+t({en:'Your USA',hr:'Tvoj SAD'})+'</b>'+t(lbl('place'))+'</li><li><b>'+t({en:'Most excited about',hr:'Najviše se veseliš'})+'</b>'+t(lbl('excite'))+'</li><li><b>'+t({en:'Your goal',hr:'Tvoj cilj'})+'</b>'+t(lbl('back'))+'</li></ul>';

  /* route */
  var c=A.country,flex=FLEX.indexOf(c)>-1,route;
  if(A.budget==='full'&&flex){
    route={n:{en:'Scholarship: FLEX Global',hr:'Stipendija: FLEX Global'},p:{en:'Your country is on the FLEX Global list, a free scholarship year in an American high school. Applications open once a year in autumn and close quickly, so check the dates for your country at discoverflexglobal.org.',hr:'Tvoja zemlja je na popisu za FLEX Global, besplatnu stipendiranu godinu u američkoj srednjoj školi. Prijave se otvaraju jednom godišnje na jesen i brzo se zatvaraju, pa provjeri datume za svoju zemlju na discoverflexglobal.org.'},link:'https://www.discoverflexglobal.org/'};
  }else if(A.budget==='full'&&c==='other'){
    route={n:{en:'Scholarship programs',hr:'Stipendirani programi'},p:{en:'Check first whether your country is on the FLEX Global list at discoverflexglobal.org. If it is not, look at ASSIST, UWC, Rotary Youth Exchange and AFS, which all offer full or partial scholarships.',hr:'Prvo provjeri je li tvoja zemlja na popisu za FLEX Global na discoverflexglobal.org. Ako nije, pogledaj ASSIST, UWC, Rotary Youth Exchange i AFS, koji nude pune ili djelomične stipendije.'},link:'https://www.discoverflexglobal.org/'};
  }else if(A.budget==='full'){
    route={n:{en:'Other scholarships',hr:'Druge stipendije'},p:{en:'FLEX Global is not open to your country, but you still have options: ASSIST, UWC, Rotary Youth Exchange and AFS offer full or partial scholarships. They are competitive, so start early.',hr:'FLEX Global nije otvoren za tvoju zemlju, ali i dalje imaš opcija: ASSIST, UWC, Rotary Youth Exchange i AFS nude pune ili djelomične stipendije. Konkurencija je velika, pa kreni na vrijeme.'}};
  }else{
    route={n:{en:'A program through an agency',hr:'Program preko agencije'},p:{en:'A paid program through an agency is the most direct way to spend a year in an American high school, and some agencies and programs offer partial scholarships too.'+(A.budget==='part'?' Since you can pay part of it, ask agencies about partial scholarships and look at AFS and Rotary as well.':''),hr:'Plaćeni program preko agencije najizravniji je put do godine u američkoj srednjoj školi, a neke agencije i programi nude i djelomične stipendije.'+(A.budget==='part'?' Budući da možete platiti dio, pitaj agencije za djelomične stipendije i pogledaj i AFS i Rotary.':'')+' Ja sam išla preko agencije BHV Education.'},link:'https://bhvedu.com/svi-programi/',hrOnly:true};
  }

  /* worry -> guide */
  var w=A.worry,isHR=c==='hr'||c==='ba'||c==='rs'||c==='me';

  var need={
   money:{en:'Knowing your real options, from scholarships to programs your family can afford.',hr:'Znati koje opcije stvarno imaš, od stipendija do programa koji si tvoja obitelj može priuštiti.'},
   english:{en:'Confidence with your English. It gets so much better once you are there, and a little preparation now helps a lot.',hr:'Sigurnost u svoj engleski. Kad stigneš, bude puno bolje, a malo pripreme sada puno pomaže.'},
   home:{en:'A real connection with your host family, because that is what makes a new place feel like home.',hr:'Prava povezanost s host obitelji, jer upravo to čini da se novo mjesto osjeća kao dom.'},
   host:{en:'A good start with your host family, with the right questions and honest conversations from day one.',hr:'Dobar početak s host obitelji, uz prava pitanja i iskrene razgovore od prvog dana.'},
   process:{en:'A clear, simple overview of how applying works, step by step.',hr:'Jasan i jednostavan pregled kako prijava funkcionira, korak po korak.'}
  }[w];
  var guide=G[gk];

  /* steps */
  var S=[];
  if(route.link&&!route.hrOnly)S.push({en:'Check the dates and conditions at <a href="'+route.link+'" target="_blank" rel="noopener">discoverflexglobal.org</a>.',hr:'Provjeri datume i uvjete na <a href="'+route.link+'" target="_blank" rel="noopener">discoverflexglobal.org</a>.'});
  else if(A.budget==='full')S.push({en:'Make a list of scholarship deadlines (ASSIST, UWC, Rotary, AFS) and write them in your calendar.',hr:'Napravi popis rokova za stipendije (ASSIST, UWC, Rotary, AFS) i upiši ih u kalendar.'});
  else S.push({en:'Talk to one or two agencies and ask about prices, deadlines and partial scholarships.',hr:'Razgovaraj s jednom ili dvije agencije i pitaj za cijene, rokove i djelomične stipendije.'+' <a href="https://bhvedu.com/svi-programi/" target="_blank" rel="noopener">Programi BHV Education →</a>'});
  S.push({en:'Get your free guide: <a href="'+guide.url+'" target="_blank" rel="noopener">'+guide.en+'</a>.',hr:'Preuzmi besplatni vodič: <a href="'+guide.url+'" target="_blank" rel="noopener">'+guide.hr+'</a>.'});
  if(A.parents!=='yes')S.push({en:'Sit down with your parents and show them this plan. Tell them why you want to go and what you would learn.',hr:'Sjedni s roditeljima i pokaži im ovaj plan. Reci im zašto želiš ići i što bi naučio/la.'});
  else if(A.english==='start')S.push({en:'Practise English a little every day: series without subtitles, podcasts and talking out loud.',hr:'Vježbaj engleski malo svaki dan: serije bez titlova, podcasti i pričanje naglas.'});
  else if(stage==='almost')S.push({en:'Start getting ready: <a href="'+G.pack.url+'" target="_blank" rel="noopener">my packing list</a> and <a href="'+G.year.url+'" target="_blank" rel="noopener">Your year abroad</a> cover everything I wish I had known.',hr:'Kreni s pripremama: <a href="'+G.pack.url+'" target="_blank" rel="noopener">moja lista za pakiranje</a> i <a href="'+G.year.url+'" target="_blank" rel="noopener">Your year abroad</a> pokrivaju sve što bih ja voljela da sam znala.'});
  else S.push({en:'Join my community to ask questions and hear from others who are on the same path.',hr:'Pridruži se mom communityju da postaviš pitanja i čuješ druge koji su na istom putu.'});

  var steps=S.map(function(s){return '<li><span>'+t(s)+'</span></li>'}).join('');
  var bundle=stage!=='dream'?'<span class="small">'+t({en:'Want everything in one place? <a href="bundle.html">See the bundle</a>.',hr:'Želiš sve na jednom mjestu? <a href="bundle.html">Pogledaj paket</a>.'})+'</span>':'';
  var routeLink=route.hrOnly?'<p style="margin-top:12px"><a lang-hr href="'+route.link+'" target="_blank" rel="noopener">Programi BHV Education →</a></p>':'';

  app.innerHTML='<div class="screen">'
   +'<div class="res-head"><div class="kick">'+t({en:'Your exchange plan',hr:'Tvoj plan za razmjenu'})+'</div><div class="stage">'+t(STAGE.n)+'</div><h1>'+t({en:'This is <em>your</em> path',hr:'Ovo je <em>tvoj</em> put'})+'</h1><p class="lead">'+t(STAGE.p)+'</p></div>'
   +'<div class="blocks">'
   +'<div class="blk wide"><h3>'+t({en:'Your dream year',hr:'Tvoja godina iz snova'})+'</h3>'+dream+'</div>'
   +'<div class="blk"><h3>'+t({en:'Your best route',hr:'Tvoj najbolji put'})+'</h3><p class="big">'+t(route.n)+'</p><p>'+t(route.p)+'</p>'+routeLink+'</div>'
   +'<div class="blk"><h3>'+t({en:'What you need most',hr:'Što ti najviše treba'})+'</h3><p class="big">'+t(lbl('worry'))+'</p><p>'+t(need)+'</p></div>'
   +'<div class="blk wide"><h3>'+t({en:'Your next 3 steps',hr:'Tvoja iduća 3 koraka'})+'</h3><ol class="steps">'+steps+'</ol></div>'
   +'</div>'
   +'<div class="cta"><div class="row"><a class="btn" href="'+guide.url+'" target="_blank" rel="noopener">'+t({en:'Get your guide',hr:'Preuzmi svoj vodič'})+' ☆</a><a class="btn ghost" href="'+VIBER+'" target="_blank" rel="noopener">'+t({en:'Join my community',hr:'Pridruži se communityju'})+'</a></div>'+bundle+'</div>'
   +'<div class="tools"><button id="sv">'+t({en:'Save my plan as PDF',hr:'Spremi plan kao PDF'})+'</button><button id="re">'+t({en:'Start again',hr:'Kreni ispočetka'})+'</button></div>'
   +'<p class="priv">'+t({en:'Your answers were never sent or saved anywhere. This plan is only in your browser, so save it as a PDF if you want to keep it.',hr:'Tvoji odgovori nisu nigdje poslani ni spremljeni. Ovaj plan postoji samo u tvom pregledniku, pa ga spremi kao PDF ako ga želiš sačuvati.'})+'</p>'
   +'</div>';
  document.getElementById('sv').onclick=function(){window.print()};
  document.getElementById('re').onclick=function(){A={};step=-1;render()};
}
render();
})();
</script>
